name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download site from canonical source
        run: |
          set -euo pipefail
          SRC="https://site-1908f3b032564ed3a61833a442f002ea.freebuff.page"
          mkdir -p _site/fonts
          for f in \
            index.html \
            google19384a0f987aaa8d.html \
            styles.css \
            fonts.css \
            main.js \
            logo.svg \
            copertina.svg \
            og.jpg \
            manifest.webmanifest \
            fonts/archivo-normal-latin.woff2 \
            fonts/stixtwotext-normal-latin.woff2 \
            fonts/stixtwotext-italic-latin.woff2 \
            fonts/stixtwotext-normal-greek.woff2 \
            fonts/stixtwotext-italic-greek.woff2
          do
            echo "GET /$f"
            curl -fsSL --retry 3 --retry-delay 2 "$SRC/$f" -o "_site/$f"
            test -s "_site/$f"
          done
          test -s _site/index.html
          test -s _site/google19384a0f987aaa8d.html
          echo "--- artefatto ---"
          find _site -type f -printf '%s\t%p\n' | sort -k2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
